<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator - STUDENT HUB</title>

    <meta name="description"
        content="Free age calculator. Calculate your exact age from your date of birth.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }

        .header-container {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            background: #eef4ff;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #667085;
            padding: 30px;
        }

        @media (max-width: 600px) {

            .header-container {
                flex-direction: column;
                gap: 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-container">

        <div class="logo">
            STUDENT HUB
        </div>

        <nav>
            <a href="../index.html">Home</a>
        </nav>

    </div>

</header>


<main>

    <div class="calculator">

        <h1>
            Age Calculator
        </h1>

        <p class="description">
            Enter your date of birth to calculate your age.
        </p>


        <label>
            Date of Birth
        </label>

        <input
            type="date"
            id="birthDate"
        >


        <button onclick="calculateAge()">
            Calculate Age
        </button>


        <div
            class="result"
            id="result"
        >
            Your age will appear here
        </div>


        <a
            class="back"
            href="../index.html"
        >
            ← Back to Student Hub
        </a>

    </div>

</main>


<footer>

    © 2026 STUDENT HUB

</footer>


<script>

function calculateAge() {

    const birthInput =
        document.getElementById("birthDate").value;

    const result =
        document.getElementById("result");


    if (!birthInput) {

        result.innerHTML =
            "Please select your date of birth.";

        return;
    }


    const birthDate =
        new Date(birthInput + "T00:00:00");


    const today =
        new Date();


    if (birthDate > today) {

        result.innerHTML =
            "Date of birth cannot be in the future.";

        return;
    }


    let years =
        today.getFullYear() -
        birthDate.getFullYear();


    let months =
        today.getMonth() -
        birthDate.getMonth();


    let days =
        today.getDate() -
        birthDate.getDate();


    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();
    }


    if (months < 0) {

        years--;

        months += 12;
    }


    result.innerHTML =
        "Your Age: " +
        years +
        " Years, " +
        months +
        " Months, " +
        days +
        " Days";

}

</script>


</body>

</html>
