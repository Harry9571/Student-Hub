<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - STUDENT HUB</title>

    <meta name="description"
        content="Free percentage calculator for students. Calculate percentage quickly and easily.">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }


        /* HEADER */

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }


        .header-container {
            max-width: 900px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 22px;
            font-weight: bold;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }


        /* MAIN */

        main {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
        }


        .calculator {
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }


        h1 {
            text-align: center;
            margin-bottom: 10px;
        }


        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }


        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }


        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d0d5dd;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 20px;
        }


        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #1d4ed8;
        }


        .result {
            margin-top: 20px;

            padding: 18px;

            background: #eef4ff;

            border-radius: 10px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;
        }


        .back {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #2563eb;

            text-decoration: none;
        }


        footer {
            text-align: center;

            color: #667085;

            padding: 30px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .header-container {
                flex-direction: column;

                gap: 10px;
            }

            nav a {
                margin: 0 7px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="header-container">

            <div class="logo">
                STUDENT HUB
            </div>

            <nav>

                <a href="../index.html">
                    Home
                </a>

            </nav>

        </div>

    </header>



    <!-- CALCULATOR -->

    <main>

        <div class="calculator">

            <h1>
                Percentage Calculator
            </h1>


            <p class="description">
                Calculate percentage quickly and easily.
            </p>



            <label>
                Obtained Marks
            </label>

            <input
                type="number"
                id="obtained"
                placeholder="Enter obtained marks"
            >



            <label>
                Total Marks
            </label>

            <input
                type="number"
                id="total"
                placeholder="Enter total marks"
            >



            <button onclick="calculatePercentage()">
                Calculate Percentage
            </button>



            <div
                class="result"
                id="result"
            >
                Your result will appear here
            </div>


            <a
                class="back"
                href="../index.html"
            >
                ← Back to Student Hub
            </a>

        </div>

    </main>



    <footer>

        © 2026 STUDENT HUB

    </footer>



    <!-- JAVASCRIPT -->

    <script>

        function calculatePercentage() {

            let obtained =
                Number(
                    document.getElementById("obtained").value
                );


            let total =
                Number(
                    document.getElementById("total").value
                );


            let result =
                document.getElementById("result");


            if (
                obtained === 0 &&
                total === 0
            ) {

                result.innerHTML =
                    "Please enter your marks.";

                return;
            }


            if (
                total <= 0 ||
                obtained < 0
            ) {

                result.innerHTML =
                    "Please enter valid marks.";

                return;
            }


            if (obtained > total) {

                result.innerHTML =
                    "Obtained marks cannot be greater than total marks.";

                return;
            }


            let percentage =
                (obtained / total) * 100;


            result.innerHTML =
                "Your Percentage: " +
                percentage.toFixed(2) +
                "%";

        }

    </script>


</body>

</html>
