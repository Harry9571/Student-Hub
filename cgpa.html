<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CGPA Calculator - STUDENT HUB</title>

    <meta name="description"
        content="Free CGPA calculator for students. Calculate percentage from CGPA easily.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }

        .header-container {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            background: #eef4ff;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .note {
            margin-top: 15px;
            font-size: 13px;
            color: #667085;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #667085;
            padding: 30px;
        }

        @media (max-width: 600px) {

            .header-container {
                flex-direction: column;
                gap: 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-container">

        <div class="logo">
            STUDENT HUB
        </div>

        <nav>
            <a href="../index.html">Home</a>
        </nav>

    </div>

</header>


<main>

    <div class="calculator">

        <h1>
            CGPA Calculator
        </h1>

        <p class="description">
            Convert your CGPA into percentage.
        </p>


        <label>
            Enter CGPA
        </label>

        <input
            type="number"
            id="cgpa"
            placeholder="Example: 8.5"
            min="0"
            max="10"
            step="0.01"
        >


        <button onclick="calculateCGPA()">
            Calculate Percentage
        </button>


        <div
            class="result"
            id="result"
        >
            Your result will appear here
        </div>


        <p class="note">
            This calculator uses the commonly used formula:
            Percentage = CGPA × 9.5
        </p>


        <a
            class="back"
            href="../index.html"
        >
            ← Back to Student Hub
        </a>

    </div>

</main>


<footer>

    © 2026 STUDENT HUB

</footer>


<script>

function calculateCGPA() {

    const cgpa =
        Number(
            document.getElementById("cgpa").value
        );


    const result =
        document.getElementById("result");


    if (
        isNaN(cgpa) ||
        cgpa < 0 ||
        cgpa > 10
    ) {

        result.innerHTML =
            "Please enter a CGPA between 0 and 10.";

        return;
    }


    const percentage =
        cgpa * 9.5;


    result.innerHTML =
        "Percentage: " +
        percentage.toFixed(2) +
        "%";

}

</script>


</body>

</html>
