<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - STUDENT HUB</title>

    <meta name="description"
        content="Contact STUDENT HUB for questions, feedback and suggestions.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }

        .header-container {
            max-width: 900px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 50px 20px;
        }

        .content {
            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            color: #475467;
            margin-bottom: 18px;
            line-height: 1.7;
        }

        .email-box {
            background: #f5f7fb;
            padding: 20px;

            border-radius: 10px;

            margin-top: 25px;
        }

        .email-box strong {
            display: block;
            margin-bottom: 8px;
        }

        .email {
            color: #2563eb;
            text-decoration: none;
            word-break: break-word;
        }

        .back {
            display: inline-block;
            margin-top: 25px;

            color: #2563eb;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #667085;
            padding: 30px;
        }

        @media (max-width: 600px) {

            .header-container {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin: 0 6px;
            }

            .content {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-container">

        <div class="logo">
            STUDENT HUB
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

        </nav>

    </div>

</header>


<main>

    <div class="content">

        <h1>
            Contact Us
        </h1>


        <p>
            If you have any questions, feedback, suggestions or
            issues related to STUDENT HUB, feel free to contact us.
        </p>


        <div class="email-box">

            <strong>
                Email
            </strong>

            <a
                class="email"
                href="mailto:akmbarwal89@gmail.com"
            >
                akmbarwal89@gmail.com
            </a>

        </div>


        <a
            class="back"
            href="index.html"
        >
            ← Back to Student Hub
        </a>

    </div>

</main>


<footer>

    © 2026 STUDENT HUB

</footer>

</html>
